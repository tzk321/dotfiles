config_version = 16

[accessibility]
ui_scale = 1.5000000149011612

[bar.default]
margin_ends = 50
position = "left"
smart_auto_hide = true
thickness = 41

[hot_corners]
enabled = true

    [hot_corners.bottom_left]
    action = "launcher"

    [hot_corners.top_right]
    action = "control_center"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1024.0
    cy = 1006.400146484375
    output = "eDP-1"
    placement_height = 1152.0
    placement_width = 2048.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
app_icon_color = "on_error"
app_icon_colorize = true
font_family = "Maple Mono NF CN SemiBold"
lang = "zh-Hans"

    [shell.animation]
    speed = 1.6000000238418579

    [shell.launcher]
    layout = "simple"

    [shell.panel]
    launcher_placement = "attached"
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true
    size = 41

[theme]
builtin = "Catppuccin"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "foot", "gtk3", "gtk4", "kitty", "niri", "qt" ]

[wallpaper.default]
path = "/home/sbtzk/Pictures/kita.png"

[wallpaper.last]
path = "/home/sbtzk/Pictures/kita.png"

[wallpaper.monitors.eDP-1]
path = "/home/sbtzk/Pictures/kita.png"

[widget.clock]
font_scale = 1.22
scale = 1.25