<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 2026-11-01: Wayland(灰度抗锯齿) 下的中文字形清晰度调优
     1) 中文统一用 Noto Sans CJK SC（避免 fallback 落到 KR/JP 字形，只有 zh 查询受影响，拉丁文不变）
     2) 拉丁文用完整 hinting（笔画对齐像素格），灰度抗锯齿 + 不做 LCD filter
     3) 默认 UI 字体：Noto Sans CJK SC Medium 11（Regular->Medium 加粗一档，10->11pt = 22px），
        见 gtk-3.0/gtk-4.0 的 gtk-font-name。实测比 Regular 10pt 干净很多。
        备选（已安装，一键切换）：gtk-font-name=LXGW Neo XiHei 11 -->
<fontconfig>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Noto Serif CJK SC</string></edit>
  </match>

  <match target="pattern">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><int>3</int></edit>
    <edit name="rgba" mode="assign"><int>5</int></edit>
    <edit name="lcdfilter" mode="assign"><int>0</int></edit>
  </match>
</fontconfig>
