# ── kitty · 竹影 ──
font_family      Maple Mono NF CN
bold_font        auto
italic_font      auto
font_size        16
adjust_line_height 110%
disable_ligatures never

foreground            #C3D6C6
background            #16211C
selection_foreground  #D6E6D7
selection_background  #25352C
cursor                #9CC29B
cursor_text_color     #16211C
url_color             #9CC29B
active_border_color   #9CC29B
inactive_border_color #25352C

color0  #16211C
color8  #25352C
color1  #C98A8A
color9  #C98A8A
color2  #9CC29B
color10 #9CC29B
color3  #C9B58A
color11 #C9B58A
color4  #7E9BB5
color12 #7E9BB5
color5  #A98BA8
color13 #A98BA8
color6  #7FB3AE
color14 #7FB3AE
color7  #C3D6C6
color15 #D6E6D7

background_opacity 0.94
background_blur 24
window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0
scrollback_lines 20000
enable_audio_bell no
cursor_shape beam
cursor_beam_thickness 1.6
mouse_hide_wait 2.0
copy_on_select yes
strip_trailing_spaces smart
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge top
tab_bar_min_tabs 2

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+left  previous_tab
map ctrl+shift+right next_tab
map ctrl+shift+q close_window
map ctrl+equal increase_font_size
map ctrl+minus decrease_font_size
map ctrl+0 reset_font_size

# morandi 动态配色（由 morandi-gen 生成）
include morandi.conf
include themes/noctalia.conf
